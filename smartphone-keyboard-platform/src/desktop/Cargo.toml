[package]
name = "phonekey-agent"
version = "0.1.0"
edition = "2021"
description = "PhoneKey Desktop Agent — receives keyboard input from smartphone"
license = "Apache-2.0"

[[bin]]
name = "phonekey-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Platform-specific HID injection
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "latency"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
